<!DOCTYPE html><html lang="uk"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#121212">
<title>Музика</title>
<style>
*{box-sizing:border-box;margin:0}
body{font:14px system-ui,sans-serif;background:#121212;color:#fff;height:100dvh;display:grid;grid-template:"s m" 1fr "b b" auto/220px 1fr}
aside{grid-area:s;background:#000;padding:24px 20px}aside h1{color:#1db954;font-size:22px;margin-bottom:20px}aside p{color:#b3b3b3;font-weight:600}
main{grid-area:m;overflow:auto;padding:20px;background:linear-gradient(#2c2c2c,#121212 280px)}
#q{width:100%;max-width:360px;padding:10px 16px;border-radius:20px;border:0;background:#2a2a2a;color:#fff;font-size:14px;margin-bottom:16px}
.row{display:flex;gap:12px;align-items:center;padding:8px;border-radius:6px;cursor:pointer}.row:hover{background:#2a2a2a}
.row.on b{color:#1db954}small{color:#b3b3b3}
.cv{width:44px;height:44px;border-radius:4px;display:grid;place-items:center;font-weight:700;font-size:18px;flex:none}
footer{grid-area:b;background:#181818;border-top:1px solid #282828;padding:10px 16px calc(10px + env(safe-area-inset-bottom));display:grid;grid-template-columns:1fr 2fr 1fr;align-items:center;gap:12px}
.now{display:flex;gap:12px;align-items:center;min-width:0}.now div:last-child{min-width:0}.now b,.now small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctl{display:flex;flex-direction:column;align-items:center;gap:6px}.btns{display:flex;gap:14px;align-items:center}
button{background:none;border:0;color:#b3b3b3;font-size:20px;cursor:pointer}button:hover,button.on{color:#fff}button.on{color:#1db954}
#pp{background:#fff;color:#000;width:38px;height:38px;border-radius:50%;font-size:16px}
.prog{display:flex;gap:8px;align-items:center;width:100%;color:#b3b3b3;font-size:12px}#sk{flex:1;accent-color:#1db954}
#md{font-size:13px;border:1px solid #444;border-radius:16px;padding:6px 12px;justify-self:end;color:#fff}
@media(max-width:700px){body{grid-template:"m" 1fr "b" auto/1fr}aside{display:none}footer{grid-template-columns:1fr;gap:8px}#md{justify-self:center}}
</style></head><body>
<aside><h1>♫ Музика</h1><p>Моя бібліотека</p></aside>
<main><input id="q" type="search" placeholder="Пошук: виконавець або назва"><div id="list"></div></main>
<footer>
<div class="now"><div class="cv" id="cv" style="background:#333">♪</div><div><b id="t">Нічого не грає</b><small id="a"></small></div></div>
<div class="ctl"><div class="btns"><button id="sh">🔀</button><button id="pv">⏮</button><button id="pp">▶</button><button id="nx">⏭</button><button id="rp">🔁</button></div>
<div class="prog"><span id="tm">0:00 / 0:00</span><input id="sk" type="range" min="0" max="1" step="1" value="0"></div></div>
<button id="md"></button>
</footer>
<script>
const $=s=>document.querySelector(s),A=new Audio();
let T=[],view=[],last=null,drag=false,lastPush=0;
let S={q:[],i:-1,playing:false,pos:0,dur:0,shuffle:false,repeat:0};
let mode=localStorage.mode||(innerWidth<700?'remote':'player');
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const col=t=>{let h=0;for(const c of t.artist+t.title)h=(h*31+c.charCodeAt(0))%360;return`hsl(${h},55%,38%)`};
const fmt=s=>isFinite(s)&&s>0?Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0'):'0:00';
function list(){
  const f=$('#q').value.toLowerCase(),cur=S.q[S.i];
  view=T.filter(t=>(t.artist+' '+t.title).toLowerCase().includes(f));
  $('#list').innerHTML=view.map((t,i)=>`<div class="row${t.id===cur?' on':''}" data-i="${i}"><div class="cv" style="background:${col(t)}">${esc(t.title[0]||'♪')}</div><div><b>${esc(t.title)}</b><br><small>${esc(t.artist)}</small></div></div>`).join('')||'<p>Треків не знайдено. Перевір папку з музикою.</p>';
}
function bar(){
  const t=T[S.q[S.i]];
  $('#t').textContent=t?t.title:'Нічого не грає';$('#a').textContent=t?t.artist:'';
  $('#cv').style.background=t?col(t):'#333';$('#cv').textContent=t?(t.title[0]||'♪'):'♪';
  $('#pp').textContent=S.playing?'⏸':'▶';
  $('#sh').className=S.shuffle?'on':'';$('#rp').className=S.repeat?'on':'';$('#rp').textContent=S.repeat===2?'🔂':'🔁';
  if(!drag){$('#sk').max=Math.floor(S.dur)||1;$('#sk').value=S.pos}
  $('#tm').textContent=fmt(S.pos)+' / '+fmt(S.dur);
  const id=t&&t.id;if(id!==last){last=id;list()}
}
function push(){
  S.playing=!A.paused;S.pos=A.currentTime||0;S.dur=A.duration||0;lastPush=Date.now();bar();
  fetch('/api/state',{method:'POST',body:JSON.stringify(S)}).catch(()=>{});
}
function load(){
  const t=T[S.q[S.i]];if(!t)return;
  A.src='/audio/'+t.id;A.play().catch(()=>{});
  if('mediaSession' in navigator)navigator.mediaSession.metadata=new MediaMetadata({title:t.title,artist:t.artist});
}
function step(d,auto){
  if(auto&&S.repeat===2){A.currentTime=0;A.play();return}
  let n=S.shuffle&&d>0?Math.floor(Math.random()*S.q.length):S.i+d;
  if(n>=S.q.length){if(S.repeat===1)n=0;else{A.pause();return}}
  S.i=Math.max(0,n);load();
}
function exec(c){
  if(c.cmd==='play'){S.q=c.q;S.i=c.i;load()}
  else if(c.cmd==='toggle'){A.paused?A.play().catch(()=>{}):A.pause()}
  else if(c.cmd==='next')step(1);
  else if(c.cmd==='prev'){A.currentTime>3?A.currentTime=0:step(-1)}
  else if(c.cmd==='seek')A.currentTime=c.t;
  else if(c.cmd==='shuffle')S.shuffle=!S.shuffle;
  else if(c.cmd==='repeat')S.repeat=(S.repeat+1)%3;
  push();
}
const send=c=>mode==='player'?exec(c):fetch('/api/cmd',{method:'POST',body:JSON.stringify(c)});
A.onended=()=>step(1,true);
A.ontimeupdate=()=>{if(Date.now()-lastPush>1000)push()};
A.onplay=A.onpause=A.ondurationchange=()=>{if(mode==='player')push()};
if('mediaSession' in navigator){
  const h=(a,f)=>{try{navigator.mediaSession.setActionHandler(a,f)}catch{}};
  h('play',()=>send({cmd:'toggle'}));h('pause',()=>send({cmd:'toggle'}));
  h('nexttrack',()=>send({cmd:'next'}));h('previoustrack',()=>send({cmd:'prev'}));
}
$('#list').onclick=e=>{const r=e.target.closest('.row');if(r)send({cmd:'play',q:view.map(t=>t.id),i:+r.dataset.i})};
$('#q').oninput=list;
$('#pp').onclick=()=>send({cmd:'toggle'});$('#nx').onclick=()=>send({cmd:'next'});$('#pv').onclick=()=>send({cmd:'prev'});
$('#sh').onclick=()=>send({cmd:'shuffle'});$('#rp').onclick=()=>send({cmd:'repeat'});
$('#sk').oninput=()=>drag=true;
$('#sk').onchange=()=>{drag=false;send({cmd:'seek',t:+$('#sk').value})};
$('#md').textContent=mode==='player'?'🔊 Грає тут':'📱 Пульт';
$('#md').onclick=()=>{localStorage.mode=mode==='player'?'remote':'player';location.reload()};
const ev=new EventSource('/events');
ev.addEventListener('state',e=>{if(mode==='remote'){S=JSON.parse(e.data);bar()}});
ev.addEventListener('cmd',e=>{if(mode==='player')exec(JSON.parse(e.data))});
fetch('/api/tracks').then(r=>r.json()).then(t=>{T=t;last=null;list();bar()});
bar();
</script></body></html>
